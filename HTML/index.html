<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table of Elements</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%);
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .left-panel {
            width: 25%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            background: rgba(20, 20, 40, 0.8);
            border-right: 2px solid rgba(100, 150, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #6495ff, #00d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 4px;
            padding: 20px;
            background: rgba(20, 20, 40, 0.6);
            border-radius: 10px;
            margin-bottom: 20px;
            height: 500px;
        }

        .element-cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #2a2a5e, #1e1e3f);
            border: 2px solid rgba(100, 150, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: all 0.3s ease;
            font-size: 10px;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .element-cell:hover {
            border-color: #6495ff;
            background: linear-gradient(135deg, #3a3a6e, #2e2e4f);
            box-shadow: 0 0 15px rgba(100, 150, 255, 0.5);
            transform: scale(1.05);
        }

        .element-cell.selected {
            background: linear-gradient(135deg, #6495ff, #00d4ff);
            border-color: #00d4ff;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.8);
            color: #000;
            font-weight: bold;
        }

        .element-number {
            font-size: 8px;
            opacity: 0.7;
        }

        .element-symbol {
            font-size: 14px;
            font-weight: bold;
        }

        .element-name {
            font-size: 7px;
            opacity: 0.8;
        }

        .info-panel {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(20, 20, 40, 0.6);
            border-radius: 10px;
        }

        .info-panel h2 {
            color: #6495ff;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .info-section {
            margin-bottom: 15px;
        }

        .info-label {
            color: #00d4ff;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-value {
            color: #e0e0e0;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .viewport-container {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #0a0a15 0%, #15153a 100%);
            border: 2px solid rgba(100, 150, 255, 0.2);
            margin: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
        }

        .canvas-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            backdrop-filter: blur(10px);
            font-size: 12px;
            color: #a0a0e0;
        }

        .right-panel {
            width: 25%;
            padding: 20px;
            background: rgba(20, 20, 40, 0.8);
            border-left: 2px solid rgba(100, 150, 255, 0.3);
            backdrop-filter: blur(10px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .right-panel h3 {
            color: #6495ff;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .properties-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 11px;
        }

        .property-item {
            background: rgba(100, 150, 255, 0.1);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #6495ff;
        }

        .property-label {
            color: #00d4ff;
            font-size: 10px;
            font-weight: bold;
        }

        .property-value {
            color: #e0e0e0;
            font-size: 11px;
            margin-top: 3px;
            font-weight: bold;
        }

        .element-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px solid rgba(100, 150, 255, 0.3);
        }

        .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: rgba(50, 50, 80, 0.6);
            border: 1px solid rgba(100, 150, 255, 0.4);
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 12px;
        }

        .search-box::placeholder {
            color: rgba(224, 224, 224, 0.5);
        }

        .search-box:focus {
            outline: none;
            border-color: #6495ff;
            box-shadow: 0 0 10px rgba(100, 150, 255, 0.3);
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            font-size: 11px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(100, 150, 255, 0.2);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid rgba(100, 150, 255, 0.3);
        }

        .category-nonmetal {
            background: #90ee90;
        }

        .category-metal {
            background: #ff9999;
        }

        .category-metalloid {
            background: #ffcc99;
        }

        .category-halogen {
            background: #ffff99;
        }

        .category-noble-gas {
            background: #cc99ff;
        }

        .category-alkali-metal {
            background: #ff99ff;
        }

        .category-alkaline-earth-metal {
            background: #ff99cc;
        }

        .category-transition-metal {
            background: #ffcccc;
        }

        .category-lanthanide {
            background: #ccffcc;
        }

        .category-actinide {
            background: #ccccff;
        }

        .no-selection {
            text-align: center;
            color: rgba(224, 224, 224, 0.5);
            margin-top: 50px;
            font-size: 14px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(50, 50, 80, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(100, 150, 255, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 150, 255, 0.8);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(100, 150, 255, 0.3);
            border-top: 2px solid #6495ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel: Periodic Table Grid -->
        <div class="left-panel">
            <div class="header">
                <h1>⚛️ Periodic Table</h1>
                <input type="text" class="search-box" id="searchBox" placeholder="Search elements...">
            </div>
            <div class="periodic-table" id="periodicTable"></div>
            <div class="legend">
                <div style="color: #6495ff; font-weight: bold; margin-bottom: 8px;">Categories:</div>
                <div class="legend-item">
                    <div class="legend-color category-nonmetal"></div>
                    <span>Nonmetal</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color category-metal"></div>
                    <span>Metal</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color category-metalloid"></div>
                    <span>Metalloid</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color category-alkali-metal"></div>
                    <span>Alkali Metal</span>
                </div>
            </div>
        </div>

        <!-- Center Panel: 3D Visualization -->
        <div class="center-panel">
            <div class="viewport-container">
                <canvas id="canvas"></canvas>
                <div class="canvas-overlay" id="canvasOverlay">
                    <div>🖱️ Drag to rotate • Scroll to zoom • Right-click to pan</div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Element Information -->
        <div class="right-panel">
            <div id="elementInfo">
                <div class="no-selection">
                    👈 Select an element from the periodic table to view details and 3D model
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let scene, camera, renderer, controls;
        let currentModel = null;
        let periodicData = null;
        let selectedElement = null;
        let filteredElements = [];

        // Initialize Three.js scene
        function initThreeJS() {
            const container = document.getElementById('canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a15);
            
            camera = new THREE.PerspectiveCamera(
                75,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.z = 2;

            renderer = new THREE.WebGLRenderer({ 
                canvas: container, 
                antialias: true,
                alpha: true 
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Load periodic table data
        async function loadPeriodicData() {
            try {
                const response = await fetch('PeriodicTableJSON.json');
                periodicData = await response.json();
                filteredElements = periodicData.elements;
                renderPeriodicTable();
            } catch (error) {
                console.error('Error loading periodic table data:', error);
            }
        }

        // Get category color class
        function getCategoryClass(category) {
            const categoryMap = {
                'diatomic nonmetal': 'category-nonmetal',
                'polyatomic nonmetal': 'category-nonmetal',
                'noble gas': 'category-noble-gas',
                'alkali metal': 'category-alkali-metal',
                'alkaline earth metal': 'category-alkaline-earth-metal',
                'transition metal': 'category-transition-metal',
                'lanthanide': 'category-lanthanide',
                'actinide': 'category-actinide',
                'post-transition metal': 'category-metal',
                'metalloid': 'category-metalloid',
                'other nonmetal': 'category-nonmetal',
                'halogen': 'category-halogen'
            };
            return categoryMap[category] || 'category-metal';
        }

        // Render periodic table grid
        function renderPeriodicTable() {
            const table = document.getElementById('periodicTable');
            table.innerHTML = '';
            
            filteredElements.forEach(element => {
                const cell = document.createElement('div');
                cell.className = `element-cell ${getCategoryClass(element.category)}`;
                cell.style.gridColumn = `${element.xpos}`;
                cell.style.gridRow = `${element.ypos}`;
                
                cell.innerHTML = `
                    <div class="element-number">${element.number}</div>
                    <div class="element-symbol">${element.symbol}</div>
                    <div class="element-name">${element.name}</div>
                `;
                
                cell.addEventListener('click', (e) => selectElement(element, e));
                cell.addEventListener('mouseover', () => {
                    cell.style.zIndex = '10';
                });
                
                table.appendChild(cell);
            });
        }

        // Load 3D model
        async function load3DModel(modelUrl) {
            // Remove previous model
            if (currentModel) {
                scene.remove(currentModel);
            }

            if (!modelUrl) {
                const geometry = new THREE.IcosahedronGeometry(0.8, 4);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x6495ff,
                    metalness: 0.7,
                    roughness: 0.2
                });
                currentModel = new THREE.Mesh(geometry, material);
                scene.add(currentModel);
                return;
            }

            try {
                const loader = new THREE.GLTFLoader();
                const gltf = await loader.loadAsync(modelUrl);
                currentModel = gltf.scene;
                
                // Center and scale the model
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 1.5 / maxDim;
                currentModel.scale.multiplyScalar(scale);

                const center = box.getCenter(new THREE.Vector3());
                currentModel.position.sub(center.multiplyScalar(scale));

                scene.add(currentModel);
                
                // Reset camera
                camera.position.z = 2;
            } catch (error) {
                console.error('Error loading 3D model:', error);
                // Fallback to basic geometry
                const geometry = new THREE.SphereGeometry(0.8, 32, 32);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x6495ff,
                    metalness: 0.7,
                    roughness: 0.2
                });
                currentModel = new THREE.Mesh(geometry, material);
                scene.add(currentModel);
            }
        }

        // Select element
        async function selectElement(element, event) {
            selectedElement = element;
            
            // Update selection styling
            document.querySelectorAll('.element-cell').forEach(cell => {
                cell.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');

            // Load 3D model
            await load3DModel(element.bohr_model_3d);

            // Update info panel
            displayElementInfo(element);
        }

        // Display element information
        function displayElementInfo(element) {
            const infoPanel = document.getElementById('elementInfo');
            
            const atomicMass = element.atomic_mass?.toFixed(3) || 'N/A';
            const density = element.density?.toFixed(4) || 'N/A';
            const meltPoint = element.melt?.toFixed(2) || 'N/A';
            const boilPoint = element.boil?.toFixed(2) || 'N/A';
            const electronegativity = element.electronegativity_pauling?.toFixed(2) || 'N/A';

            infoPanel.innerHTML = `
                <h2>${element.name}</h2>
                <div class="info-section">
                    <div class="info-label">Symbol: ${element.symbol}</div>
                    <div class="info-label">Atomic Number: ${element.number}</div>
                    <div class="info-label">Atomic Mass: ${atomicMass}</div>
                </div>

                <div class="info-section">
                    <div class="info-label">Category</div>
                    <div class="info-value">${element.category}</div>
                </div>

                <div class="info-section">
                    <div class="info-label">Physical Properties</div>
                    <div class="properties-grid">
                        <div class="property-item">
                            <div class="property-label">Density</div>
                            <div class="property-value">${density} g/cm³</div>
                        </div>
                        <div class="property-item">
                            <div class="property-label">Melting Point</div>
                            <div class="property-value">${meltPoint} K</div>
                        </div>
                        <div class="property-item">
                            <div class="property-label">Boiling Point</div>
                            <div class="property-value">${boilPoint} K</div>
                        </div>
                        <div class="property-item">
                            <div class="property-label">Phase</div>
                            <div class="property-value">${element.phase}</div>
                        </div>
                    </div>
                </div>

                <div class="info-section">
                    <div class="info-label">Electron Configuration</div>
                    <div class="info-value">${element.electron_configuration}</div>
                </div>

                <div class="info-section">
                    <div class="info-label">Electronegativity</div>
                    <div class="info-value">${electronegativity}</div>
                </div>

                ${element.image?.url ? `
                    <img src="${element.image.url}" alt="${element.name}" class="element-image" 
                         onerror="this.style.display='none'">
                ` : ''}

                <div class="info-section">
                    <div class="info-label">Summary</div>
                    <div class="info-value" style="font-size: 12px; line-height: 1.5;">
                        ${element.summary}
                    </div>
                </div>
            `;
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filteredElements = periodicData.elements.filter(el => 
                el.name.toLowerCase().includes(searchTerm) ||
                el.symbol.toLowerCase().includes(searchTerm)
            );
            renderPeriodicTable();
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            loadPeriodicData();
        });
    </script>
</body>
</html>
